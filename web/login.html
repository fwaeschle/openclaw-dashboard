<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — OpenClaw Dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  background: #09090b;
  color: #fafafa;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.card {
  width: 100%;
  max-width: 400px;
  background: #18181b;
  border: 1px solid #27272a;
  border-radius: 12px;
  padding: 2.5rem 2rem;
  margin: 1rem;
}

h1 {
  font-size: 1.25rem;
  font-weight: 600;
  color: #fafafa;
  text-align: center;
  margin-bottom: 0.5rem;
}

.subtitle {
  font-size: 0.875rem;
  color: #a1a1aa;
  text-align: center;
  margin-bottom: 2rem;
}

.field { margin-bottom: 1rem; }

label {
  display: block;
  font-size: 0.875rem;
  font-weight: 500;
  color: #e4e4e7;
  margin-bottom: 0.375rem;
}

input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 0.625rem 0.75rem;
  font-size: 0.875rem;
  color: #fafafa;
  background: #27272a;
  border: 1px solid #3f3f46;
  border-radius: 8px;
  outline: none;
  transition: border-color 0.15s;
}

input:focus {
  border-color: #fafafa;
  box-shadow: 0 0 0 2px rgba(250, 250, 250, 0.1);
}

input::placeholder { color: #71717a; }

button {
  width: 100%;
  padding: 0.625rem 1rem;
  margin-top: 0.5rem;
  font-size: 0.875rem;
  font-weight: 500;
  color: #18181b;
  background: #fafafa;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
}

button:hover { background: #d4d4d8; }
button:active { background: #a1a1aa; }

.error {
  margin-top: 1rem;
  padding: 0.625rem 0.75rem;
  font-size: 0.8125rem;
  color: #fca5a5;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.2);
  border-radius: 8px;
  text-align: center;
  display: none;
}

.error.visible { display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>OpenClaw Dashboard</h1>
  <p class="subtitle">Anmeldung erforderlich</p>
  <form method="POST" action="/login">
    <div class="field">
      <label for="username">Benutzername</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Anmelden</button>
  </form>
  <div class="error {{ERROR_CLASS}}">{{ERROR_MESSAGE}}</div>
</div>
</body>
</html>
