<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Secrets · OpenClaw Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #e5e5e5; margin: 0; padding: 2rem; }
    h1 { margin: 0 0 1.5rem 0; }
    .nav { margin-bottom: 2rem; }
    .nav a { color: #60a5fa; margin-right: 1rem; text-decoration: none; }
    .flash { padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1.5rem; }
    .flash.success { background: #14532d; color: #bbf7d0; }
    .flash.warn    { background: #78350f; color: #fed7aa; }
    .flash.error   { background: #7f1d1d; color: #fecaca; }
    section { background: #171717; border: 1px solid #262626; border-radius: 6px; padding: 1.25rem; margin-bottom: 1.5rem; }
    h2 { margin: 0 0 1rem 0; font-size: 1.1rem; }
    label { display: inline-block; width: 5rem; color: #a3a3a3; }
    input[type=text], input[type=password] { background: #0a0a0a; border: 1px solid #404040; color: #e5e5e5; padding: 0.5rem; border-radius: 4px; width: 22rem; font-family: ui-monospace, monospace; }
    button, input[type=submit] { background: #2563eb; color: white; border: 0; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
    button.danger { background: #dc2626; }
    button.secondary { background: #404040; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #262626; }
    th { color: #a3a3a3; font-weight: 500; }
    td form { display: inline; margin: 0; }
    td .edit { margin-top: 0.5rem; }
    details summary { cursor: pointer; color: #60a5fa; }
    .row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/">← Dashboard</a>
    <form action="/logout" method="post" style="display:inline"><button class="secondary" type="submit">Logout</button></form>
  </div>

  <h1>Secrets</h1>

  {{if .FlashKind}}
  <div class="flash {{.FlashKind}}">{{.FlashText}}</div>
  {{end}}

  <section>
    <h2>Neuer Key setzen</h2>
    <form method="post" action="/secrets">
      <div class="row"><label for="k">Key</label><input type="text" id="k" name="key" autocomplete="off" required pattern="[A-Z_][A-Z0-9_]*" maxlength="128"></div>
      <div class="row"><label for="v">Value</label><input type="password" id="v" name="value" autocomplete="off" required maxlength="500"></div>
      <div class="row"><span style="width:5rem"></span><button type="submit">Speichern</button></div>
    </form>
  </section>

  <section>
    <h2>Existierende Keys ({{len .Keys}})</h2>
    {{if .Keys}}
    <table>
      <thead><tr><th>Name</th><th style="width:10rem">Aktion</th><th style="width:8rem">Löschen</th></tr></thead>
      <tbody>
      {{range .Keys}}
      <tr>
        <td><code>{{.}}</code></td>
        <td>
          <details>
            <summary>Ändern</summary>
            <form class="edit" method="post" action="/secrets">
              <input type="hidden" name="key" value="{{.}}">
              <input type="password" name="value" autocomplete="off" required maxlength="500" placeholder="Neuer Wert">
              <button type="submit">Speichern</button>
            </form>
          </details>
        </td>
        <td>
          <form method="post" action="/secrets/delete" onsubmit="return confirm('Key {{.}} wirklich löschen?')">
            <input type="hidden" name="key" value="{{.}}">
            <button type="submit" class="danger">Löschen</button>
          </form>
        </td>
      </tr>
      {{end}}
      </tbody>
    </table>
    {{else}}
    <p style="color:#a3a3a3">Noch keine Keys gesetzt.</p>
    {{end}}
  </section>
</body>
</html>
